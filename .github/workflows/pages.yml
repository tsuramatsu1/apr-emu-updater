name: Deploy manifest to Pages

# Publishes apr_emu_manifest.json to GitHub Pages and nothing else, so payload
# loaders can read the list from a plain https host.

on:
  push:
    branches: [main]
    paths:
      - apr_emu_manifest.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A loader reads this to find and verify the payload, so a manifest that
      # does not parse, or that advertises a checksum the file does not have,
      # would send people a download they cannot use. Catch it before it is live.
      - name: Check the manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, urllib.request

          path = "apr_emu_manifest.json"
          if not os.path.exists(path):
              sys.exit("%s is missing" % path)

          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)

          if not doc.get("name"):
              sys.exit("the manifest has no name")

          payloads = doc.get("payloads")
          if not isinstance(payloads, list) or not payloads:
              sys.exit("the manifest lists no payloads")

          problems = []
          for index, entry in enumerate(payloads):
              label = entry.get("filename") or entry.get("name") or "entry %d" % index
              for field in ("name", "filename", "url", "version", "checksum",
                            "category", "last_update"):
                  if not entry.get(field):
                      problems.append("%s: %s is missing" % (label, field))

              checksum = (entry.get("checksum") or "").strip()
              if checksum and (len(checksum) != 64 or
                               any(c not in "0123456789abcdefABCDEF" for c in checksum)):
                  problems.append("%s: checksum is not a sha256 hex digest" % label)

              stamp = entry.get("last_update") or ""
              if stamp and not re.match(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}$", stamp):
                  problems.append(
                      "%s: last_update should be YYYY-MM-DD, got %r" % (label, stamp))

              url = entry.get("url") or ""
              if "/blob/" in url:
                  problems.append(
                      "%s: url points at a github page, which serves html rather than "
                      "the file. Use the raw or releases/download form" % label)

              # The manifest promises that this URL serves a file with this hash,
              # so check the URL rather than a local copy: with a release-pinned or
              # releases/latest URL the repository file is a different build.
              if url and checksum and not problems:
                  try:
                      with urllib.request.urlopen(url, timeout=60) as response:
                          served = hashlib.sha256(response.read()).hexdigest()
                  except Exception as error:
                      problems.append("%s: could not fetch %s (%s)" % (label, url, error))
                  else:
                      if served.lower() != checksum.lower():
                          problems.append(
                              "%s: checksum does not match what the url serves\n"
                              "      manifest %s\n      served   %s"
                              % (label, checksum.upper(), served.upper()))

          if problems:
              sys.exit("manifest problems:\n  " + "\n  ".join(problems))

          print("manifest ok: %d payload(s)" % len(payloads))
          for entry in payloads:
              print("  %s %s -> %s" % (entry.get("filename"), entry.get("version"),
                                       entry.get("url")))
          PY

      - name: Stage the manifest on its own
        run: |
          mkdir -p site
          cp apr_emu_manifest.json site/
          ls -l site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
