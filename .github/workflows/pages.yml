name: Deploy manifest to Pages

# Publishes apr_emu_manifest.json to GitHub Pages and nothing else, so PS5
# Payload Manager can read it as a custom payload repository.

on:
  push:
    branches: [main]
    paths:
      - apr_emu_manifest.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The manager expects a bare array of flat entries carrying exactly these
      # fields. An object wrapper, a missing field or a stray one and it reads
      # nothing at all, silently, so the shape is checked before publishing.
      - name: Check the manifest
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, urllib.request

          path = "apr_emu_manifest.json"
          if not os.path.exists(path):
              sys.exit("%s is missing" % path)

          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)

          if not isinstance(doc, list) or not doc:
              sys.exit("expected a non-empty array of payload entries, got %s"
                       % type(doc).__name__)

          FIELDS = ("name", "filename", "url", "source", "source_direct",
                    "description", "last_update", "version", "category")
          CATEGORIES = ("Loaders", "Networking & Servers", "System & Jailbreak",
                        "Utilities & Tools")

          problems = []
          for index, entry in enumerate(doc):
              if not isinstance(entry, dict):
                  problems.append("entry %d: not an object" % index)
                  continue
              label = entry.get("filename") or entry.get("name") or "entry %d" % index

              for field in FIELDS:
                  if not entry.get(field):
                      problems.append("%s: %s is missing" % (label, field))
              extra = sorted(set(entry) - set(FIELDS))
              if extra:
                  problems.append("%s: unexpected field(s) %s"
                                  % (label, ", ".join(extra)))

              if entry.get("category") and entry["category"] not in CATEGORIES:
                  problems.append("%s: category %r is not one of %s"
                                  % (label, entry["category"], ", ".join(CATEGORIES)))

              stamp = entry.get("last_update") or ""
              if stamp and not re.match(r"^[0-9]{4}-[0-9]{2}-[0-9]{2}$", stamp):
                  problems.append("%s: last_update should be YYYY-MM-DD, got %r"
                                  % (label, stamp))

              for field in ("url", "source_direct"):
                  value = entry.get(field) or ""
                  if "/blob/" in value:
                      problems.append(
                          "%s: %s points at a github page, which serves html rather "
                          "than the file. Use the releases/download form"
                          % (label, field))

              # There is no checksum field in this format, so integrity is checked
              # here: whatever the url serves must be the payload in this repo.
              local = entry.get("filename")
              url = entry.get("url") or ""
              if url and local and os.path.exists(local) and not problems:
                  want = hashlib.sha256(open(local, "rb").read()).hexdigest()
                  try:
                      with urllib.request.urlopen(url, timeout=60) as response:
                          served = hashlib.sha256(response.read()).hexdigest()
                  except Exception as error:
                      problems.append("%s: could not fetch %s (%s)"
                                      % (label, url, error))
                  else:
                      if served != want:
                          problems.append(
                              "%s: the url does not serve the payload in this repo\n"
                              "      repo   %s\n      served %s"
                              % (label, want.upper(), served.upper()))

          if problems:
              sys.exit("manifest problems:\n  " + "\n  ".join(problems))

          print("manifest ok: %d entry(ies)" % len(doc))
          for entry in doc:
              print("  %s %s [%s] -> %s"
                    % (entry.get("filename"), entry.get("version"),
                       entry.get("category"), entry.get("url")))
          PY

      - name: Stage the manifest on its own
        run: |
          mkdir -p site
          cp apr_emu_manifest.json site/
          ls -l site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
